<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-container">
        <!-- LEFT SIDEBAR -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <div class="sidebar-logo">
                    <svg viewBox="0 0 1134 340" width="32" height="32">
                        <path fill="#fff" d="M8 171c0 92 76 168 168 168s168-76 168-168S268 4 176 4 8 79 8 171zm230 78c-39-24-89-37-147-43-7 0-13 6-13 13 0 8 5 12 11 13 54 6 99 19 134 41 5 3 11 4 17 4 14 0 23-10 23-24 0-6-3-12-8-15zm17-46c-43-27-104-43-169-43-14 0-21 8-21 17 0 9 6 15 14 17 58 15 115 31 153 54 6 4 13 6 20 6 15 0 24-11 24-25 0-7-4-14-11-20z"/>
                        <path fill="#fff" d="M469 171c0 92 76 168 168 168s168-76 168-168S729 4 637 4 469 79 469 171zm230 78c-39-24-89-37-147-43-7 0-13 6-13 13 0 8 5 12 11 13 54 6 99 19 134 41 5 3 11 4 17 4 14 0 23-10 23-24 0-6-3-12-8-15zm17-46c-43-27-104-43-169-43-14 0-21 8-21 17 0 9 6 15 14 17 58 15 115 31 153 54 6 4 13 6 20 6 15 0 24-11 24-25 0-7-4-14-11-20z"/>
                        <path fill="#fff" d="M927 171c0 92 76 168 168 168s168-76 168-168-76-168-168-168-168 76-168 168zm230 78c-39-24-89-37-147-43-7 0-13 6-13 13 0 8 5 12 11 13 54 6 99 19 134 41 5 3 11 4 17 4 14 0 23-10 23-24 0-6-3-12-8-15zm17-46c-43-27-104-43-169-43-14 0-21 8-21 17 0 9 6 15 14 17 58 15 115 31 153 54 6 4 13 6 20 6 15 0 24-11 24-25 0-7-4-14-11-20z"/>
                    </svg>
                </div>
                <nav class="sidebar-nav">
                    <a href="#home" class="nav-item active" data-view="home" title="Home">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 3.247a1 1 0 00-1 0L4 7.577V20h4.5v-6a1 1 0 011-1h5a1 1 0 011 1v6H20V7.577l-7.5-4.33zm-2-1.732a3 3 0 013 0l7.5 4.33a2 2 0 011 1.732V21a1 1 0 01-1 1h-6.5a1 1 0 01-1-1v-6h-3v6a1 1 0 01-1 1H3a1 1 0 01-1-1V7.577a2 2 0 011-1.732l7.5-4.33z"/></svg>
                        <span>Home</span>
                    </a>
                    <a href="#search" class="nav-item" data-view="search" title="Search">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10.533 1.279c-5.18 0-9.407 4.14-9.407 9.279s4.226 9.279 9.407 9.279c2.234 0 4.29-.77 5.907-2.058l4.353 4.353a1 1 0 101.414-1.414l-4.344-4.344a9.157 9.157 0 002.077-5.816c0-5.14-4.226-9.28-9.407-9.28zm-7.407 9.279c0-4.006 3.302-7.28 7.407-7.28s7.407 3.274 7.407 7.28-3.302 7.279-7.407 7.279-7.407-3.273-7.407-7.28z"/></svg>
                        <span>Search</span>
                    </a>
                    <a href="#uploads" class="nav-item" data-view="uploads" title="My Music">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a.75.75 0 01.75.75v7.69l2.72-2.72a.75.75 0 111.06 1.06l-4 4a.75.75 0 01-1.06 0l-4-4a.75.75 0 111.06-1.06l2.72 2.72V3.75A.75.75 0 0112 3z"/><path d="M3.75 15a.75.75 0 01.75.75v2.5a1.5 1.5 0 001.5 1.5h12a1.5 1.5 0 001.5-1.5v-2.5a.75.75 0 011.5 0v2.5a3 3 0 01-3 3H6a3 3 0 01-3-3v-2.5a.75.75 0 01.75-.75z"/></svg>
                        <span>My Music</span>
                    </a>
                </nav>
                <button class="sidebar-toggle" id="btnSidebarToggle" title="Close sidebar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <line x1="9" y1="3" x2="9" y2="21"/>
                    </svg>
                </button>
            </div>

            <div class="sidebar-library">
                <div class="library-header">
                    <button class="library-title-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 22a1 1 0 01-1-1V3a1 1 0 012 0v18a1 1 0 01-1 1zM15.5 2.134A1 1 0 0014 3v18a1 1 0 001.5.866l11-6.5a1 1 0 000-1.732l-11-6.5zM9 2a1 1 0 00-1 1v18a1 1 0 102 0V3a1 1 0 00-1-1z"/></svg>
                        <span>Your Library</span>
                    </button>
                    <button class="btn-icon-sm" id="btnCreatePlaylist" title="Create playlist">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M15.25 8a.75.75 0 01-.75.75H8.75v5.75a.75.75 0 01-1.5 0V8.75H1.5a.75.75 0 010-1.5h5.75V1.5a.75.75 0 011.5 0v5.75h5.75a.75.75 0 01.75.75z"/></svg>
                    </button>
                </div>

                <div class="library-filter">
                    <button class="filter-chip active" data-filter="all">Playlists</button>
                    <button class="filter-chip" data-filter="liked">Liked</button>
                </div>

                <div class="library-list">
                    <ul class="playlist-list" id="playlistList"></ul>
                </div>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content" id="mainContent">
            <div class="topbar" id="topbar">
                <div class="topbar-left">
                    <button class="hamburger-btn" id="btnHamburger" title="Menu">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
                    </button>
                    <button class="nav-arrow" id="btnBack" disabled>
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M11.03.47a.75.75 0 010 1.06L4.56 8l6.47 6.47a.75.75 0 11-1.06 1.06L2.44 8 9.97.47a.75.75 0 011.06 0z"/></svg>
                    </button>
                    <button class="nav-arrow" id="btnForward" disabled>
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M4.97.47a.75.75 0 000 1.06L11.44 8l-6.47 6.47a.75.75 0 101.06 1.06L13.56 8 6.03.47a.75.75 0 00-1.06 0z"/></svg>
                    </button>
                </div>
                <div class="topbar-center" id="searchBarContainer" style="display:none;">
                    <div class="search-input-wrap">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M7 1.75a5.25 5.25 0 100 10.5 5.25 5.25 0 000-10.5zM.25 7a6.75 6.75 0 1112.096 4.12l3.184 3.185a.75.75 0 11-1.06 1.06L11.284 12.18A6.75 6.75 0 01.25 7z"/></svg>
                        <input type="text" placeholder="What do you want to listen to?" id="globalSearch" autocomplete="off">
                    </div>
                </div>
                <div class="topbar-right">
                    <button class="btn-user" id="btnUser">
                        <div class="user-avatar">U</div>
                    </button>
                </div>
            </div>

            <div class="content-scroll" id="contentScroll">
                <div class="content-area" id="contentArea"></div>
            </div>
        </div>

        <!-- RIGHT PANEL (Now Playing) -->
        <div class="right-panel" id="rightPanel">
            <div class="right-panel-header">
                <span class="right-panel-title" id="rightPanelTitle">Yaariyaan - Male</span>
                <button class="btn-icon-sm" id="btnCloseRightPanel" title="Close">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2.47 2.47a.75.75 0 011.06 0L8 6.94l4.47-4.47a.75.75 0 111.06 1.06L9.06 8l4.47 4.47a.75.75 0 11-1.06 1.06L8 9.06l-4.47 4.47a.75.75 0 01-1.06-1.06L6.94 8 2.47 3.53a.75.75 0 010-1.06z"/></svg>
                </button>
            </div>
            <div class="right-panel-art" id="rightPanelArt">
                <div class="album-art-large" id="albumArtLarge">
                    <div class="album-art-placeholder">♫</div>
                </div>
            </div>
            <div class="right-panel-info">
                <div class="song-info-large">
                    <h2 class="song-title-large" id="songTitleLarge">Yaariyaan - Male</h2>
                    <p class="song-artist-large" id="songArtistLarge">Pritam, Mohan Kannan, Shilpa Rao</p>
                </div>
                <button class="btn-like-large liked" id="btnLikeLarge">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- PLAYER BAR -->
    <div class="player-bar" id="playerBar">
        <div class="player-left">
            <div class="player-thumb" id="playerThumb">
                <div class="player-thumb-placeholder">♫</div>
            </div>
            <div class="player-song-info">
                <span class="player-song-name" id="playerSongName">No song selected</span>
                <span class="player-artist-name" id="playerArtist">-</span>
            </div>
            <button class="btn-like-small" id="playerLike">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
            </button>
        </div>

        <div class="player-center">
            <div class="player-controls">
                <button class="btn-ctrl" id="btnShuffle" title="Shuffle">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M13.151.922a.75.75 0 10-1.06 1.06L13.109 3H11.16a3.75 3.75 0 00-2.873 1.34l-6.173 7.356A2.25 2.25 0 01.39 12.5H0V14h.391a3.75 3.75 0 002.873-1.34l6.173-7.356a2.25 2.25 0 011.724-.804h1.947l-1.017 1.018a.75.75 0 001.06 1.06L15.98 3.75 13.15.922zM.391 3.5H0V2h.391c1.109 0 2.16.49 2.873 1.34L4.89 5.277l-.979 1.167-1.796-2.14A2.25 2.25 0 00.39 3.5z"/><path d="M7.5 10.723l.98-1.167 1.796 2.14c.453.54 1.115.804 1.724.804h1.947l-1.017-1.018a.75.75 0 111.06-1.06l2.829 2.828-2.829 2.828a.75.75 0 11-1.06-1.06L13.109 13H11.16a3.75 3.75 0 01-2.873-1.34L7.5 10.723z"/></svg>
                </button>
                <button class="btn-ctrl" id="btnPrev" title="Previous">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M3.3 1a.7.7 0 01.7.7v5.15l9.95-5.744a.7.7 0 011.05.606v12.575a.7.7 0 01-1.05.607L4 9.149V14.3a.7.7 0 01-.7.7H2.7a.7.7 0 01-.7-.7V1.7a.7.7 0 01.7-.7h.6z"/></svg>
                </button>
                <button class="btn-play" id="btnPlay" title="Play">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" id="iconPlay"><path d="M3 1.713a.7.7 0 011.05-.607l10.89 6.288a.7.7 0 010 1.212L4.05 14.894A.7.7 0 013 14.288V1.713z"/></svg>
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" id="iconPause" style="display:none;"><path d="M2.7 1a.7.7 0 00-.7.7v12.6a.7.7 0 00.7.7h2.6a.7.7 0 00.7-.7V1.7a.7.7 0 00-.7-.7H2.7zm8 0a.7.7 0 00-.7.7v12.6a.7.7 0 00.7.7h2.6a.7.7 0 00.7-.7V1.7a.7.7 0 00-.7-.7h-2.6z"/></svg>
                </button>
                <button class="btn-ctrl" id="btnNext" title="Next">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M12.7 1a.7.7 0 00-.7.7v5.15L2.05 1.107A.7.7 0 001 1.712v12.575a.7.7 0 001.05.607L12 9.149V14.3a.7.7 0 00.7.7h.6a.7.7 0 00.7-.7V1.7a.7.7 0 00-.7-.7h-.6z"/></svg>
                </button>
                <button class="btn-ctrl" id="btnRepeat" title="Repeat">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M0 4.75A3.75 3.75 0 013.75 1h8.5A3.75 3.75 0 0116 4.75v5a3.75 3.75 0 01-3.75 3.75H9.81l1.018 1.018a.75.75 0 11-1.06 1.06L6.939 12.75l2.829-2.828a.75.75 0 111.06 1.06L9.811 12h2.439a2.25 2.25 0 002.25-2.25v-5a2.25 2.25 0 00-2.25-2.25h-8.5A2.25 2.25 0 001.5 4.75v5A2.25 2.25 0 003.75 12H5v1.5H3.75A3.75 3.75 0 010 9.75v-5z"/></svg>
                </button>
            </div>
            <div class="progress-row">
                <span class="time-label" id="timeCurrent">0:00</span>
                <div class="progress-track" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                    <div class="progress-knob" id="progressThumb"></div>
                </div>
                <span class="time-label" id="timeTotal">0:00</span>
            </div>
        </div>

        <div class="player-right">
            <button class="btn-ctrl" id="btnNowPlaying" title="Now Playing View">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M11.196 8 6 5v6l5.196-3z"/><path d="M15.002 1.75A1.75 1.75 0 0013.252 0h-10.5a1.75 1.75 0 00-1.75 1.75v12.5c0 .966.784 1.75 1.75 1.75h10.5a1.75 1.75 0 001.75-1.75V1.75zm-1.75-.25a.25.25 0 01.25.25v12.5a.25.25 0 01-.25.25h-10.5a.25.25 0 01-.25-.25V1.75a.25.25 0 01.25-.25h10.5z"/></svg>
            </button>
            <button class="btn-ctrl" id="btnQueue" title="Queue">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M15 15H1v-1.5h14V15zm0-4.5H1V9h14v1.5zm-14-7A2.5 2.5 0 013.5 1h9a2.5 2.5 0 010 5h-9A2.5 2.5 0 011 3.5zm2.5-1a1 1 0 000 2h9a1 1 0 100-2h-9z"/></svg>
            </button>
            <div class="volume-group">
                <button class="btn-ctrl" id="btnVolume" title="Volume">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M9.741.85a.75.75 0 01.375.65v13a.75.75 0 01-1.125.65l-6.925-4a3.642 3.642 0 01-1.33-4.967 3.639 3.639 0 011.33-1.332l6.925-4a.75.75 0 01.75 0zm-6.924 5.3a2.139 2.139 0 000 3.7l5.683 3.29V2.86L2.817 6.15zm11.686 4.342a3.75 3.75 0 00-2.835-1.223 3.75 3.75 0 00-2.835 1.223.75.75 0 001.06 1.06 2.25 2.25 0 013.18 0 .75.75 0 001.06-1.06zm-2.835-3.284a5.25 5.25 0 00-3.976 0 .75.75 0 10.472 1.416 3.75 3.75 0 013.028 0 .75.75 0 10.476-1.416z"/></svg>
                </button>
                <div class="volume-track" id="volumeBar">
                    <div class="volume-fill" id="volumeFill"></div>
                    <div class="volume-knob" id="volumeThumb"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <!-- SIDEBAR OVERLAY (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- MOBILE BOTTOM NAV -->
    <nav class="mobile-nav" id="mobileNav">
        <a href="#home" class="mobile-nav-item active" data-view="home">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 3.247a1 1 0 00-1 0L4 7.577V20h4.5v-6a1 1 0 011-1h5a1 1 0 011 1v6H20V7.577l-7.5-4.33zm-2-1.732a3 3 0 013 0l7.5 4.33a2 2 0 011 1.732V21a1 1 0 01-1 1h-6.5a1 1 0 01-1-1v-6h-3v6a1 1 0 01-1 1H3a1 1 0 01-1-1V7.577a2 2 0 011-1.732l7.5-4.33z"/></svg>
            <span>Home</span>
        </a>
        <a href="#search" class="mobile-nav-item" data-view="search">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10.533 1.279c-5.18 0-9.407 4.14-9.407 9.279s4.226 9.279 9.407 9.279c2.234 0 4.29-.77 5.907-2.058l4.353 4.353a1 1 0 101.414-1.414l-4.344-4.344a9.157 9.157 0 002.077-5.816c0-5.14-4.226-9.28-9.407-9.28zm-7.407 9.279c0-4.006 3.302-7.28 7.407-7.28s7.407 3.274 7.407 7.28-3.302 7.279-7.407 7.279-7.407-3.273-7.407-7.28z"/></svg>
            <span>Search</span>
        </a>
        <a href="#uploads" class="mobile-nav-item" data-view="uploads">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a.75.75 0 01.75.75v7.69l2.72-2.72a.75.75 0 111.06 1.06l-4 4a.75.75 0 01-1.06 0l-4-4a.75.75 0 111.06-1.06l2.72 2.72V3.75A.75.75 0 0112 3z"/><path d="M3.75 15a.75.75 0 01.75.75v2.5a1.5 1.5 0 001.5 1.5h12a1.5 1.5 0 001.5-1.5v-2.5a.75.75 0 011.5 0v2.5a3 3 0 01-3 3H6a3 3 0 01-3-3v-2.5a.75.75 0 01.75-.75z"/></svg>
            <span>My Music</span>
        </a>
        <button class="mobile-nav-item" id="btnMobileLibrary">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 22a1 1 0 01-1-1V3a1 1 0 012 0v18a1 1 0 01-1 1zM15.5 2.134A1 1 0 0014 3v18a1 1 0 001.5.866l11-6.5a1 1 0 000-1.732l-11-6.5zM9 2a1 1 0 00-1 1v18a1 1 0 102 0V3a1 1 0 00-1-1z"/></svg>
            <span>Library</span>
        </button>
    </nav>

    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 id="modalTitle"></h3>
                <button class="btn-icon-sm" id="btnModalClose">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2.47 2.47a.75.75 0 011.06 0L8 6.94l4.47-4.47a.75.75 0 111.06 1.06L9.06 8l4.47 4.47a.75.75 0 11-1.06 1.06L8 9.06l-4.47 4.47a.75.75 0 01-1.06-1.06L6.94 8 2.47 3.53a.75.75 0 010-1.06z"/></svg>
                </button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/player.js"></script>
    <script src="js/search.js"></script>
    <script src="js/playlist.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
